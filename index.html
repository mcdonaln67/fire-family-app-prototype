<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111113"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Last Shift">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="img/icon-180.png">
<title>Last Shift Strong – Every shift strong.</title>
<style>
:root{--bg:#111113;--card:#1d1d20;--line:#303036;--tx:#f2f2f2;--mut:#9a9aa3;--org:#ff6a13;--g:#2ecc71;--y:#f5c518;--r:#ff4d4d;--tier:var(--g)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.3px}header h1 small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.persona{display:flex;background:var(--card);border-radius:20px;padding:3px;border:1px solid var(--line)}
.persona button{border:0;background:none;color:var(--mut);padding:6px 11px;border-radius:16px;font-weight:700;font-size:13px}
.persona button.on{background:var(--org);color:#fff}
main{flex:1;overflow-y:auto;padding:14px 14px 100px;-webkit-overflow-scrolling:touch}
.view{animation:in .28s ease}@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.sheet-bg{position:absolute;inset:0;background:#0008;z-index:30;animation:fade .2s}@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#18181b;border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));z-index:31;animation:up .3s cubic-bezier(.2,.8,.2,1);border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(100%)}}.grab{width:40px;height:5px;background:#444;border-radius:3px;margin:4px auto 12px}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#151517ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px;line-height:1}nav button.on{color:var(--org)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:700;margin-bottom:6px}
h2{font-size:22px;margin:2px 0 10px}h3{font-size:16px;margin:0 0 6px}
.mut{color:var(--mut)}.small{font-size:12.5px}.ex-tag{display:inline-block;font-size:10px;background:#333;color:#ccc;padding:2px 6px;border-radius:5px;font-weight:700;letter-spacing:.5px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;background:var(--org);color:#fff;margin-top:8px}
.btn.sec{background:#2a2a2f;color:var(--tx);border:1px solid var(--line)}.btn.red{background:var(--r)}
.btn:active,.chip:active,.ex:active{transform:scale(.98)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:#26262a;color:var(--tx);border-radius:18px;padding:7px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--org);border-color:var(--org);color:#fff}
.tier{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--tier) 25%,#1d1d20),#1d1d20);border:1px solid var(--tier);margin-bottom:12px;transition:all .4s}
.dot{width:16px;height:16px;border-radius:50%;background:var(--tier);box-shadow:0 0 12px var(--tier);transition:all .4s;flex:none}
input[type=range]{width:100%;accent-color:var(--org)}
.ex{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.ex:first-of-type{border-top:0}
.ex .n{flex:1}.ex .n b{display:block;font-size:14.5px}.ex .acts{display:flex;gap:4px}
.ex .acts button{border:1px solid var(--line);background:#26262a;color:var(--tx);border-radius:8px;font-size:11px;padding:5px 6px;font-weight:700}
.ex.done b{text-decoration:line-through;color:var(--mut)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px}.ex.done .chk{background:var(--g);border-color:var(--g)}
.timer{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px}
.banner{background:#3a1a10;border:1px solid var(--org);border-radius:12px;padding:10px;font-size:13px;margin-bottom:12px}
.planned{display:inline-block;background:#3b2f0a;color:var(--y);border:1px solid #6b5510;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.6px}
.example{display:inline-block;background:#222a3a;color:#8fb3ff;border:1px solid #34436a;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{padding:8px 0;border-radius:8px;font-size:12px;background:#222}
.cal .on{background:#5a1f0b;color:#ffb48a;font-weight:700}.cal .sel{outline:2px solid var(--org)}.cal .h{background:none;color:var(--mut);font-size:10px}
.lb{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.lb:first-child{border:0}.lb .rk{width:22px;font-weight:800;color:var(--org)}.lb .av{width:32px;height:32px;border-radius:50%;background:#333;display:grid;place-items:center;font-weight:700;font-size:12px}
.bar{height:6px;border-radius:3px;background:#2a2a2f;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--org)}
.hero{border-radius:16px;overflow:hidden;position:relative;margin-bottom:12px;background:#000}.hero img{width:100%;height:300px;object-fit:cover;object-position:50% 25%;display:block}
.hero .ov{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(transparent,#000d)}
.badge{display:inline-block;background:linear-gradient(90deg,#f5a524,#ff6a13);color:#111;font-weight:800;font-size:12px;padding:3px 8px;border-radius:7px;text-transform:uppercase}
.cred{display:inline-flex;align-items:center;gap:5px;background:#2b2b2f;border:1px solid #45454c;border-radius:7px;padding:4px 8px;font-size:12px;font-weight:600;margin:0 4px 5px 0}.cred:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--org)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#333;padding:9px 16px;border-radius:20px;font-size:13px;z-index:50;animation:fade .2s;white-space:nowrap}
.steps{display:flex;gap:5px;margin-bottom:14px}.steps i{flex:1;height:4px;border-radius:2px;background:#333}.steps i.on{background:var(--org)}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.big button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:16px 0;font-size:24px;font-weight:800}.big button.on{border-color:var(--org);background:#3a1a10}.big button small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.row b{white-space:nowrap}
.bio p{margin:0 0 10px;font-size:14.5px;line-height:1.55;color:#e6e6e6}.bio p:last-child{margin:0}
.tl{position:relative;padding-left:20px}.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#3a3a40}
.tl div{position:relative;padding:0 0 12px}.tl div:last-child{padding:0}.tl div:before{content:"";position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--org)}
.tl div:last-child:before{background:var(--org)}.tl b{display:block;font-size:14px}.tl span{font-size:12.5px;color:var(--mut)}
</style></head><body><div id="app">
<header><h1><span style="color:var(--org)">Last Shift</span> Strong <small>Every shift strong.</small></h1>
<div class="persona"><button data-p="ryan" class="on">Ryan · FF</button><button data-p="jess">Jess · Spouse</button></div></header>
<main id="main"></main>
<nav id="nav"></nav>
</div><script src="library.js"></script><script src="app.js"></script></body></html>
